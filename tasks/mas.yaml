---
#
# Mac App Store applications
#
# `mas` can only install apps that are already attached to the signed-in
# Apple Account. Sign in through the App Store app first -- `mas signin`
# has not worked headlessly since Catalina.
#
- name: Ensure MAS is installed
  homebrew:
    name: mas
    state: present

- name: List installed MAS apps
  command: mas list
  register: mas_list
  check_mode: no
  changed_when: false

- name: MAS present applications
  command: mas install '{{ item.id }}'
  loop: '{{ mas_installed_apps }}'
  loop_control:
    label: '{{ item.name }}'
  when: 'item.id | string not in mas_list.stdout'
...
