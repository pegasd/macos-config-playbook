---
- when: vim_plugins | length > 0
  block:
    - name: Vim plugins directory
      file:
        path: ~/.vim/bundle
        state: directory
        mode: 0700
    - name: Vim plugins
      git:
        dest: '~/.vim/bundle/{{ item.name }}'
        repo: '{{ item.repo }}'
        update: '{{ update_vim_plugins }}'
        force: '{{ update_vim_plugins }}'
      loop: '{{ vim_plugins }}'

- name: Bring over my dotfiles
  git:
    dest: '~/.dotfiles'
    repo: '{{ dotfiles_repo }}'
    update: '{{ update_dotfiles }}'
    force: '{{ update_dotfiles }}'

- name: rsync '~/.dotfiles' -> '~'
  synchronize:
    src: '~/.dotfiles/'
    dest: '~'
    archive: false
    recursive: true
    perms: true
    links: true
    times: true
    rsync_opts:
      - '--exclude=.git'
      - '--exclude=LICENSE'
      - '--exclude=*.md'
      # Without this the top-level dir mtime always differs and the task
      # reports 'changed' on every run.
      - '--omit-dir-times'

#
# After the rsync: it applies the repository's own modes (0755), so these
# have to run last or GnuPG and the history dir end up world-readable.
#
- name: Private directories
  file:
    path: '~/{{ item }}'
    state: directory
    mode: 0700
  loop: [ .history, .gnupg ]
...
