---
- name: Configure macOS
  hosts: localhost
  connection: local
  vars:
    #
    # Dotfiles
    #
    update_dotfiles: true
    # Must be the SSH form. ~/.gitconfig_local carries
    #   [url "git@github.com:"] insteadOf = https://github.com/
    # so an https:// URL is rewritten to SSH at clone time anyway, and the git
    # module then sees its configured URL differ from the recorded remote and
    # reports 'changed' on every run.
    dotfiles_repo: git@github.com:pegasd/dotfiles

    #
    # Personal repositories cloned into ~/Developer
    #
    dev_dir: '{{ ansible_facts.env.HOME }}/Developer'
    dev_repos:
      - { name: ansible-freebsd, repo: 'git@github.com:pegasd/ansible-freebsd' }
      - { name: ansible-playbooks, repo: 'https://git.pegas.icu/pegas/ansible-playbooks.git' }
      - { name: strudel-tracks, repo: 'git@github.com:pegasd/strudel-tracks.git' }

    #
    # Mac App Store
    #
    # IDs verified against the live App Store with `mas info <id>`.
    # Do not copy IDs out of an installed app blindly: Apple relisted the
    # iWork apps under unified IDs and the old Mac-only ones (409201541,
    # 409183694, 409203825) are delisted -- `mas install` fails on them.
    #
    # Requires being signed into the App Store first -- `mas` can only install
    # apps that are already attached to the account.
    #
    mas_installed_apps:
      - { name: Bitwarden, id: 1352778147 }
      - { name: Logic Pro, id: 634148309 }
      - { name: Spark, id: 1176895641 } # listed as "Spark Classic"
      - { name: WireGuard, id: 1451685025 }
      # v2RayTun (was 6476628951) has been pulled from the App Store.
      # See README -> Manual steps.

    #
    # Homebrew
    #
    # homebrew/cask ships with Homebrew since 4.x; cask-versions and cask-fonts
    # were archived in 2024. Do not tap any of them.
    #
    brew_present_taps:
      - house-of-vanity/tap # furumi
    brew_absent_taps:
      - puppetlabs/puppet # pdk
    brew_present_packages:
      - ansible
      - bitwarden-cli
      - colima # docker runtime, in place of Docker Desktop
      - colordiff
      - docker
      - docker-buildx
      - grep # GNU grep is nice
      - helm
      - house-of-vanity/tap/furumi
      - htop
      - k9s
      - kubectx
      - mas
      - pssh
      - rbenv
      - rclone
      - transmission-cli
      - unar
      - virtualenv
    brew_absent_packages: []
    brew_present_casks:
      - battle-net
      - claude
      - claude-code
      - epic-games
      - gcloud-cli # was: google-cloud-sdk
      - google-chrome
      - intellij-idea-ce
      - istat-menus
      - iterm2
      - slack
      - steam
      - telegram
      - transmission
      - vlc
      - zoom
    brew_absent_casks: []

    #
    # Fonts
    #
    # These are the faces referenced by files/iterm_profile.json.
    #
    fonts:
      - font-roboto-mono-nerd-font
      - font-sf-mono

    #
    # Vim
    #
    update_vim_plugins: false
    vim_plugins:
      - name: syntastic
        repo: https://github.com/vim-syntastic/syntastic
      - name: tabular
        repo: https://github.com/godlygeek/tabular
  tasks:
    - import_tasks: tasks/osx_defaults.yaml
      tags: [ osx_defaults ]
    - import_tasks: tasks/iterm.yaml
      tags: [ osx_defaults, iterm ]
    - import_tasks: tasks/applications.yaml
      tags: [ applications ]
    - import_tasks: tasks/mas.yaml
      tags: [ applications, mas ]
    - import_tasks: tasks/dotfiles.yaml
      tags: [ applications, dotfiles ]
    - import_tasks: tasks/fonts.yaml
      tags: [ fonts ]
    - import_tasks: tasks/repos.yaml
      tags: [ repos ]
...
